[package]
name = "dock-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Evernear attested dock check: reads the slip result and computes the release"

[[bin]]
name = "dock-check"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
