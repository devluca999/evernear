[package]
name = "release-gate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Evernear release gate: holds the escrow grant token inside an attested OutLayer run and releases only on the required signals"

[[bin]]
name = "release-gate"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"
wasi-http-client = "0.2"

[dev-dependencies]
ed25519-dalek = "2"
hmac = "0.12"

[profile.release]
opt-level = "z"
lto = true
strip = true
